[workspace]
resolver = "2"
members = [
    "crates/hp-pty",
    "crates/hp-core",
    "crates/hp-agents",
    "crates/hp-store",
    "crates/hp-shell",
    "crates/hp-teams",
    "crates/hp-mcp",
    "crates/hp-room",
    "crates/hp-identity",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Duc-python/HyperPane"
rust-version = "1.82"

[workspace.dependencies]
hp-pty = { path = "crates/hp-pty" }
hp-core = { path = "crates/hp-core" }
hp-agents = { path = "crates/hp-agents" }
hp-store = { path = "crates/hp-store" }
hp-shell = { path = "crates/hp-shell" }
hp-teams = { path = "crates/hp-teams" }
hp-mcp = { path = "crates/hp-mcp" }
hp-room = { path = "crates/hp-room" }
hp-identity = { path = "crates/hp-identity" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
portable-pty = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
