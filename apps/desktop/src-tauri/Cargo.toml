[package]
name = "hyperpane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HyperPane desktop app"
default-run = "hyperpane"

[lib]
name = "hyperpane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The frontend a release embeds. `tauri-build` reads `frontendDist` only when
# this is on; without it a release binary keeps the `devUrl` and opens
# localhost:5173, which is not running, so the window shows a connection error.
# `tauri build` turns it on itself; a plain `cargo build --release` needs
# `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hp-core.workspace = true
hp-pty.workspace = true
hp-agents.workspace = true
hp-store.workspace = true
hp-shell.workspace = true
hp-teams.workspace = true
hp-mcp.workspace = true
hp-room.workspace = true
hp-identity.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
